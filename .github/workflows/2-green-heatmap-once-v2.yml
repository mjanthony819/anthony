name: One-time green heatmap update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
      - name: Replace only heatmap color blocks and remove one-shot workflow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('main.css')
          s = p.read_text()
          blocks = [
              ('.as-cell {\n  width: 10px;\n  height: 10px;\n  border-radius: 2px;\n  background: #ebedf0;\n}\n.as-cell.as-l1 {\n  background: #c9c9c9;\n}\n.as-cell.as-l2 {\n  background: #8f8f8f;\n}\n.as-cell.as-l3 {\n  background: #4a4a4a;\n}\n.as-cell.as-l4 {\n  background: #0a0a0a;\n}',
               '.as-cell {\n  width: 10px;\n  height: 10px;\n  border-radius: 2px;\n  background: #e8f5e9;\n}\n.as-cell.as-l1 {\n  background: #a5d6a7;\n}\n.as-cell.as-l2 {\n  background: #66bb6a;\n}\n.as-cell.as-l3 {\n  background: #2e9d50;\n}\n.as-cell.as-l4 {\n  background: #146b35;\n}'),
              ('.as-cell {\n    background: #222;\n  }\n  .as-cell.as-l1 {\n    background: #4a4a4a;\n  }\n  .as-cell.as-l2 {\n    background: #7d7d7d;\n  }\n  .as-cell.as-l3 {\n    background: #b5b5b5;\n  }\n  .as-cell.as-l4 {\n    background: #f2f2f2;\n  }',
               '.as-cell {\n    background: #102318;\n  }\n  .as-cell.as-l1 {\n    background: #0e4429;\n  }\n  .as-cell.as-l2 {\n    background: #006d32;\n  }\n  .as-cell.as-l3 {\n    background: #26a641;\n  }\n  .as-cell.as-l4 {\n    background: #39d353;\n  }')
          ]
          changed = False
          for old, new in blocks:
              if new in s:
                  continue
              if s.count(old) != 1:
                  raise SystemExit('Expected one original heatmap block; aborting without edits')
              s = s.replace(old, new)
              changed = True
          p.write_text(s)
          print('Heatmap already green' if not changed else 'Updated only the two .as-cell color blocks')
          PY
          rm .github/workflows/1-green-heatmap-once.yml .github/workflows/1-green-heatmap-once-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.css .github/workflows/12-one-time-green-heatmap.yml
          if git diff --cached --quiet; then
            echo 'Nothing to commit; workflow run was idempotent.'
            exit 0
          fi
          git commit -m 'Use green-only contribution heatmap levels'
          git push
