<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="notes-style.css"><title>Notes · M J Anthony</title></head><body><main><nav><a href="./">M J Anthony</a><a href="notes.html">Notes</a></nav><div class="eyebrow">Events, experiments & other things</div><h1 id="heading">Notes</h1><p class="muted" id="intro">Things worth writing down.</p><section id="posts" aria-live="polite"></section></main><script src="notes-core.js"></script><script>getData().then(d=>{const id=new URLSearchParams(location.search).get('post');const ps=d.posts.filter(p=>!id||p.id===id).sort((a,b)=>b.date.localeCompare(a.date));if(!ps.length){$('#posts').append(el('p',id?'Post not found.':'Nothing here yet.'));return}if(id){$('#heading').textContent=ps[0].title;$('#intro').remove();document.title=ps[0].title+' · Notes';const a=article(ps[0]);a.querySelector('h2').remove();$('#posts').append(a)}else for(const p of ps){const row=el('article'),link=el('a',p.title);link.className='title';link.href='notes.html?post='+encodeURIComponent(p.id);const h=el('h2');h.append(link);row.append(el('time',p.date),h,el('p',p.body.slice(0,180)+(p.body.length>180?'…':'')));$('#posts').append(row)}}).catch(()=>$('#posts').append(el('p','Notes could not load. Please try again.')));</script></body></html>
